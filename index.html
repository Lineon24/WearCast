<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WearCast</title>

    <!--
      🛠️ 트러블슈팅 [v0.0.7]: base.css 폰트 스택 맨 앞에 'Pretendard Variable'을 지정해뒀지만
      실제로 이 폰트를 불러오는 코드가 없어서 항상 그 다음 순번(OS 기본 폰트)으로 렌더링되고 있었다.
      Mac/iOS는 -apple-system(+Apple SD Gothic Neo)로, Windows는 Inter/-apple-system이 전부
      없는 폰트라 건너뛰고 Segoe UI+맑은 고딕으로 렌더링되는데, 맑은 고딕이 애플 고딕보다
      한글 글자폭이 넓어서 네비게이션처럼 폭이 고정된 요소가 OS별로 다르게 밀려 보였다.
      Pretendard를 실제로 로드해서 OS와 무관하게 항상 같은 폰트로 렌더링되도록 고쳤다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
